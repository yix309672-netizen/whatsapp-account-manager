# ============================================================================
# WhatsApp 账号管理器 —— Nginx 反向代理（HTTP + WebSocket + 可选 HTTPS）
#
# 用法：
#   1. 把 guanli.example.com 换成你的域名，复制到 /etc/nginx/sites-available/waam
#   2. ln -s /etc/nginx/sites-available/waam /etc/nginx/sites-enabled/waam
#   3. nginx -t && systemctl reload nginx
#   4. 上 HTTPS：certbot --nginx -d guanli.example.com
#
# 关键点：前端全靠 WebSocket（/ws）调用后端命令，必须转发 Upgrade 头，
# 并放开 read_timeout，否则页面看着能开、操作一直转圈。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name guanli.example.com;

    # 登录/命令走 WS，截图与导出可能较大
    client_max_body_size 50m;

    access_log /var/log/nginx/waam.access.log;
    error_log  /var/log/nginx/waam.error.log;

    location / {
        proxy_pass http://127.0.0.1:9527;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 服务端靠这两个头识别真实 IP（限流、审计日志用）
        proxy_set_header CF-Connecting-IP  $remote_addr;

        # WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
